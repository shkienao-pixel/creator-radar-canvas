文逐段中译。漏段不标完成，成功批次缓存，失败单独补译。","accent":205,"chips":[{"label":"固定 6 人","tone":"accent"},{"label":"设置在阅读页统一填写","tone":"muted"}],"sections":[{"heading":"从哪里读、调用谁","rows":[{"label":"输入原文","value":"仅处理主画布入选、收藏、含笔记或已持久排队且正文完整的真实内容；每阶段最多60条，不处理GitHub技术文档。"},{"label":"模型服务","value":"阅读页填写的模型接口地址 + /chat/completions；使用你配置的模型名与模型 Key。"},{"label":"发送内容","value":"原文正文、标题、作者、内容类型与文字总结要求；超过 120,000 字符会报错，不会静默截断。"}]},{"heading":"这一节点负责总结与完整逐段中译","items":["中文标题、一句话主旨、充分中文总结；长文目标300～600字，短帖按原文信息量说明，格言与问题保留原话，不扩写凑字。","核心论点、原文依据与摘录；仅列原文支持的行动建议，健康内容附证据局限。","全文按原始段落编号逐段中译；长文按约5000字符分批，检查段落数量、编号、顺序及英文全文覆盖。漏段或输出截断不会标完成。","校验JSON和原文摘录；这不是独立事实核验或翻译语义质量验收。"]},{"heading":"输出与单独重试","rows":[{"label":"保存结果","value":"总结和 bilingual 英中逐段对照写入 analysis；只有全文对齐才设置 translation_complete，summary_status / summary_error 记录文字及翻译状态。"},{"label":"失败与缓存","value":"成功批次按正文、模型和接口缓存；未完成任务持久排队，跨日继续，额度用完暂停请求并排队，不把待译内容标完成。"},{"label":"连线输出","value":"run_id、summarized（文字成功数）、summary_failed（文字失败数）；下一步仍直接读原文。"}]}]},"note":"### ③ 文字总结独立处理\n\n- 读取：仅入选、收藏、含笔记或持久排队的完整原文，调用已配置模型。\n- 生成：中文标题、一句话主旨、中文总结、论点与依据、行动建议；健康内容附证据局限。\n- 校验：检查字段和原文摘录，不匹配摘录删除并提示。\n- 保存：文字与翻译独立状态；未完成队列跨日保留，额度不足排队，复用成功批次。\n- 原文未变且文字已成功时直接复用。详细规则见「查看本步说明」。"},{"id":"RadarStage-diagram","stage":"diagram","order":4,"name":"④ 独立生成文章结构图","description":"按编号原文生成结构图，每个节点绑定准确引句和段落，再单独核对说法是否由原文支持。点分支直接高亮对应原文；无依据不展示。","input":"任务编号与文字总结统计","output":"任务编号与结构图统计","position":{"x":1230,"y":40},"width":350,"height":320,"guide":{"title":"④ 独立生成文章结构图","subtitle":"按编号原文生成结构图，每个节点绑定准确引句和段落，再单独核对说法是否由原文支持。点分支直接高亮对应原文；无依据不展示。","accent":205,"chips":[{"label":"固定 6 人","tone":"accent"},{"label":"设置在阅读页统一填写","tone":"muted"}],"sections":[{"heading":"这一节点的输入与调用","rows":[{"label":"输入","value":"数据库内完整原文、标题、作者与内容类型；直接分析原文，不依赖文字总结是否成功。"},{"label":"独立请求","value":"向同一个已配置的 /chat/completions 发起另一次模型请求，只要求结构树 JSON。"},{"label":"处理范围","value":"仅处理入选、收藏、含笔记或已持久排队且图尚未成功的完整原文，每阶段最多60条；正文未变且图已核对通过时复用。"}]},{"heading":"具体生成与检查什么","items":["生成 outline：每个中文节点都包含 source_quotes；系统从实际原文推导 paragraph_ids，模型自填编 }]},"note":"### ⑤ 保存到哪里、怎么用\n\n- 阅读：[localhost:8080](http://localhost:8080)，今天最多18条帖、本周最多12篇长文，另有归档、收藏与回收区。\n- 留档：原文保存在本地数据库；运行报告只存条目ID和正文哈希引用，不重复全文。\n- 下载：单篇 Markdown、结构数据 JSON、结构图 SVG / PNG。\n- 更新：帖子每30分钟检查、长文每日上海08:00；也可立即更新。普通归档90天后进30天可恢复回收区，收藏和笔记长期保护。\n- 状态：缺页、缺正文或分析失败会显示部分完成。"}],"edges":[{"id":"RadarStage-collect-RadarStage-enrich","source":"RadarStage-collect","target":"RadarStage-enrich"},{"id":"RadarStage-enrich-RadarStage-summarize","source":"RadarStage-enrich","target":"RadarStage-summarize"},{"id":"RadarStage-summarize-RadarStage-diagram","source":"RadarStage-summarize","target":"RadarStage-diagram"},{"id":"RadarStage-diagram-RadarStage-publish","source":"RadarStage-diagram","target":"RadarStage-publish"}],"policies":{"schedule":"帖子每30分钟检查；官网与RSS长文每日北京时间08:00更新。","capacity":"今天帖子每人最多3条，共18条；本周长文每人最多2篇，共12篇。","retention":"普通归档保留90天，再进入30天可恢复回收区；收藏与笔记长期保护。"}}</script>
  <script>
(() => {
  'use strict';
  const $ = selector => document.querySelector(selector);
  const viewport = $('#viewport');
  const world = $('#world');
  const nodeLayer = $('#nodes');
  const noteLayer = $('#notes');
  const edgeLayer = $('#connections');
  const drawer = $('#details');
  const mobile = () => matchMedia('(max-width:650px)').matches;
  const camera = {x:42,y:60,scale:1};
  const graph = {nodes:[],edges:[],byId:new Map(),positions:new Map(),elements:new Map(),bounds:null,selected:null};
  let documentData = null;
  let gesture = null;
  let suppressClickUntil = 0;
  let previousFocus = null;
  let resizeTimer;
  let loadVersion = 0;
  let manuallyMoved = false;

  function element(tag,className,text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = String(text ?? '');
    return el;
  }
  function icon(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('aria-hidden','true');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',name === 'book' ? 'M12 5C9 3 5 3 3 4v15c3-1 6-1 9 1m0-15c3-2 7-2 9-1v15c-3-1-6-1-9 1V5' : 'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v11H5z');
    svg.append(path);
    return svg;
  }
  function safeUrl(value) {
    try { const u = new URL(value); return ['https:','http:'].includes(u.protocol) ? u.href : null; }
    catch { return null; }
  }
  function cleanName(node) { return String(node.name || node.guide?.title || '工作流节点').replace(/^[①②③④⑤⑥⑦⑧⑨⑩\d\s.、]+/u,'').trim(); }
  function applyCamera() {
    world.style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
    viewport.style.backgroundPosition = `${camera.x}px ${camera.y}px`;
    viewport.style.backgroundSize = `${20 * camera.scale}px ${20 * camera.scale}px`;
    $('#zoom-value').textContent = `${Math.round(camera.scale * 100)}%`;
  }
  function zoom(value,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2) {
    const next = Math.max(.15,Math.min(1.7,value));
    const factor = next/camera.scale;
    camera.x = cx-(cx-camera.x)*factor;
    camera.y = cy-(cy-camera.y)*factor;
    camera.scale = next;
    manuallyMoved = true;
    applyCamera();
  }
  function updateBounds() {
    const boxes=[];
    for(const [id,card] of graph.elements) {
      const p=graph.positions.get(id);
      if(!p)continue;
      boxes.push({x:p.x-8,y:p.y,width:card.offsetWidth+16,height:card.offsetHeight});
      const label=card.querySelector('.node-order');
      if(label)boxes.push({x:p.x+label.offsetLeft,y:p.y+label.offsetTop,width:label.offsetWidth,height:label.offsetHeight});
    }
    for(const card of noteLayer.children)boxes.push({x:card.offsetLeft,y:card.offsetTop,width:card.offsetWidth,height:card.offsetHeight});
    if(!boxes.length){graph.bounds=null;return}
    const x=Math.min(...boxes.map(box=>box.x)),y=Math.min(...boxes.map(box=>box.y));
    const right=Math.max(...boxes.map(box=>box.x+box.width)),bottom=Math.max(...boxes.map(box=>box.y+box.height));
    graph.bounds={x,y,width:right-x,height:bottom-y};
    world.style.width=`${Math.max(1,right+80)}px`;world.style.height=`${Math.max(1,bottom+80)}px`;
  }
  function fitGraph(initial=false) {
    updateBounds();
    if (!graph.bounds) return;
    const b=graph.bounds, width=viewport.clientWidth, height=viewport.clientHeight;
    const s=Math.min(1,Math.max(1,width-64)/Math.max(1,b.width),Math.max(1,height-105)/Math.max(1,b.height));
    camera.scale = initial && mobile() ? Math.max(.72,s) : s;
    camera.x = initial && mobile() ? 26-b.x*camera.scale : (width-b.width*camera.scale)/2-b.x*camera.scale;
    camera.y = Math.max(26,(height-58-b.height*camera.scale)/2)-b.y*camera.scale;
    manuallyMoved = false;
    applyCamera();
  }
  function inputPoint(node) {
    const p=graph.positions.get(node.id);
    return {x:p.x,y:p.y+199};
  }
  function outputPoint(node) {
    const p=graph.positions.get(node.id),el=graph.elements.get(node.id);
    return {x:p.x+350,y:p.y+el.offsetHeight-21};
  }
  function renderEdges() {
    edgeLayer.replaceChildren();
    for (const edge of graph.edges) {
      const a=outputPoint(graph.byId.get(edge.source)),b=inputPoint(graph.byId.get(edge.target));
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const bend=Math.max(28,Math.abs(b.x-a.x)*.55);
      path.setAttribute('d',`M${a.x} ${a.y} C${a.x+bend} ${a.y},${b.x-bend} ${b.y},${b.x} ${b.y}`);
      if (edge.source===graph.selected || edge.target===graph.selected) path.classList.add('is-selected');
      edgeLayer.append(path);
    }
  }
  function summaryLines(node) {
    const lines=[];
    for (const section of node.guide?.sections || []) {
      for (const row of section.rows || []) {
        if (lines.length >= 3) return lines;
        lines.push(`${row.label || section.heading}：${row.value || ''}`);
      }
      for (const item of section.items || []) {
        if (lines.length >= 3) return lines;
        lines.push(String(item));
      }
    }
    if (!lines.length) lines.push(node.description || '点击查看本节点的处理说明。');
    return lines;
  }
  function openOnKeyboard(event,node) {
    if (event.target===event.currentTarget && ['Enter',' '].includes(event.key)) {
      event.preventDefault(); openNode(node.id);
    }
  }
  function renderNode(node,index) {
    const p=graph.positions.get(node.id);
    const card=element('article','workflow-node');
    card.tabIndex=0;
    card.setAttribute('aria-label',`${index+1} ${cleanName(node)}，点击查看节点说明`);
    card.style.left=`${p.x}px`;card.style.top=`${p.y}px`;
    card.dataset.nodeId=node.id;
    card.append(element('span','node-order',`STEP ${String(index+1).padStart(2,'0')}`));
    const header=element('header','node-header');
    header.append(element('span','stage-number',index+1),element('h2','',cleanName(node)),element('span','node-drag-mark','⠿'));
    header.setAttribute('title','拖动标题移动节点');
    card.append(header,element('p','node-description',node.description || node.guide?.subtitle || ''));
    const input=element('div','node-input');
    input.append(element('span','field-label',node.input || '上一步任务'));
    const value=element('div','field-input');value.append(element('span','',index===0?'阅读页或定时器自动传入':'接收上一步任务'),icon('lock'));input.append(value);card.append(input);
    const guide=element('button','guide-button');guide.type='button';guide.append(icon('book'),element('span','','查看本步说明'));guide.setAttribute('aria-label',`查看第 ${index+1} 步：${cleanName(node)}的说明`);card.append(guide);
    const footer=element('footer','node-footer',node.output || '传递任务与处理结果');
    const out=element('span','node-port port-out');out.setAttribute('aria-hidden','true');footer.append(out);card.append(footer);
    if(index>0){const incoming=element('span','node-port port-in');incoming.setAttribute('aria-hidden','true');card.append(incoming)}
    card.addEventListener('click',()=>{if(Date.now()>suppressClickUntil)openNode(node.id)});
    card.addEventListener('keydown',event=>openOnKeyboard(event,node));
    header.addEventListener('pointerdown',event=>startNodeDrag(event,node));
    nodeLayer.append(card);graph.elements.set(node.id,card);
    return card;
  }
  function renderNote(node,index,top) {
    const p=graph.positions.get(node.id);
    const card=element('article','note-card');card.style.left=`${p.x}px`;card.style.top=`${top}px`;card.tabIndex=0;card.dataset.noteId=node.id;
    card.setAttribute('aria-label',`${index+1} ${cleanName(node)}的说明卡，点击查看完整说明`);
    card.append(element('h3','',`${index+1}　${cleanName(node)}`));
    const list=element('ul');
    for(const line of summaryLines(node))list.append(element('li','',line));
    card.append(list,element('span','note-open','点击查看完整说明 ↗'));
    card.addEventListener('click',()=>{if(Date.now()>suppressClickUntil)openNode(node.id)});
    card.addEventListener('keydown',event=>openOnKeyboard(event,node));noteLayer.append(card);
    return card;
  }
  function renderGraph() {
    nodeLayer.replaceChildren();noteLayer.replaceChildren();graph.elements.clear();graph.positions.clear();
    graph.nodes.forEach((node,index)=>{const raw=node.position || {};graph.positions.set(node.id,{x:Number.isFinite(raw.x)?raw.x:index*410,y:Number.isFinite(raw.y)?raw.y:40});renderNode(node,index)});
    const noteTop=Math.max(...graph.nodes.map(node=>graph.positions.get(node.id).y+graph.elements.get(node.id).offsetHeight))+64;
    graph.nodes.forEach((node,index)=>renderNote(node,index,noteTop));
    renderEdges();fitGraph(true);
  }
  function renderSection(section) {
    const box=element('section','detail-section');box.append(element('h3','',section.heading || '处理说明'));
    for(const row of section.rows || []){const value=element('div','detail-row');value.append(element('strong','',row.label || ''),element('div','',row.value || ''));box.append(value)}
    if(section.items?.length){const list=element('ul');for(const item of section.items)list.append(element('li','',item));box.append(list)}
    return box;
  }
  function openNode(id) {
    const node=graph.byId.get(id);if(!node)return;
    const index=graph.nodes.indexOf(node);
    if(drawer.hidden)previousFocus=document.activeElement;
    graph.selected=id;
    $('#detail-step').textContent=`STEP ${String(index+1).padStart(2,'0')} · 节点说明`;
    $('#detail-title').textContent=cleanName(node);
    $('#detail-description').textContent=node.guide?.subtitle || node.description || '';
    const content=$('#detail-content');content.replaceChildren();content.scrollTop=0;
    const io=element('section','io-section');
    for(const [label,value] of [['输入',node.input],['输出',node.output]]){const row=element('div','io-row');row.append(element('span','',label),element('div','',value || '未提供'));io.append(row)}
    content.append(io);
    for(const section of node.guide?.sections || [])content.append(renderSection(section));
    const source=safeUrl(documentData.source?.github);
    if(source){const link=element('a','source-link','查看工作流源码 ↗');link.href=source;link.target='_blank';link.rel='noopener noreferrer';content.append(link)}
    $('#detail-position').textContent=`${index+1} / ${graph.nodes.length}`;
    $('#previous-node').disabled=index===0;$('#next-node').disabled=index===graph.nodes.length-1;
    for(const [key,card] of graph.elements)card.classList.toggle('is-selected',key===id);
    noteLayer.querySelectorAll('[data-note-id]').forEach(card=>card.classList.toggle('is-selected',card.dataset.noteId===id));
    drawer.hidden=false;drawer.setAttribute('aria-modal',String(mobile()));$('#drawer-backdrop').hidden=!mobile();renderEdges();
    $('#close-details').focus({preventScroll:true});$('#announcement').textContent=`已打开第 ${index+1} 步：${cleanName(node)}`;
  }
  function closeDetails() {
    drawer.hidden=true;$('#drawer-backdrop').hidden=true;graph.selected=null;
    for(const card of graph.elements.values())card.classList.remove('is-selected');
    noteLayer.querySelectorAll('.is-selected').forEach(card=>card.classList.remove('is-selected'));renderEdges();
    if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});
  }
  function navigateNode(direction) {
    const index=graph.nodes.findIndex(node=>node.id===graph.selected),node=graph.nodes[index+direction];
    if(node)openNode(node.id);
  }
  function startNodeDrag(event,node) {
    if(event.button!==0)return;
    event.preventDefault();event.stopPropagation();
    const p=graph.positions.get(node.id);
    gesture={kind:'node',id:event.pointerId,startX:event.clientX,startY:event.clientY,x:p.x,y:p.y,node,moved:false};
    viewport.setPointerCapture(event.pointerId);
  }
  viewport.addEventListener('pointerdown',event=>{
    if(event.button!==0 || event.target.closest('button,a,.workflow-node,.note-card'))return;
    event.preventDefault();gesture={kind:'pan',id:event.pointerId,startX:event.clientX,startY:event.clientY,x:camera.x,y:camera.y,moved:false};viewport.setPointerCapture(event.pointerId);viewport.classList.add('is-panning');
  });
  viewport.addEventListener('pointermove',event=>{
    if(!gesture || gesture.id!==event.pointerId)return;
    const dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;
    if(Math.hypot(dx,dy)>4)gesture.moved=true;
    if(!gesture.moved)return;
    manuallyMoved=true;
    if(gesture.kind==='pan'){camera.x=gesture.x+dx;camera.y=gesture.y+dy;applyCamera()}
    else{const p=graph.positions.get(gesture.node.id),card=graph.elements.get(gesture.node.id);p.x=gesture.x+dx/camera.scale;p.y=gesture.y+dy/camera.scale;card.style.left=`${p.x}px`;card.style.top=`${p.y}px`;renderEdges()}
  });
  function endGesture(event) {
    if(!gesture || gesture.id!==event.pointerId)return;
    const current=gesture;gesture=null;viewport.classList.remove('is-panning');
    if(viewport.hasPointerCapture(event.pointerId))viewport.releasePointerCapture(event.pointerId);
    if(current.moved)suppressClickUntil=Date.now()+180;
    else if(current.kind==='node' && event.type==='pointerup'){suppressClickUntil=Date.now()+180;openNode(current.node.id)}
  }
  viewport.addEventListener('pointerup',endGesture);viewport.addEventListener('pointercancel',endGesture);
  viewport.addEventListener('wheel',event=>{
    event.preventDefault();
    const bounds=viewport.getBoundingClientRect();
    if(event.shiftKey){camera.x-=event.deltaY;camera.y-=event.deltaX;manuallyMoved=true;applyCamera()}
    else zoom(camera.scale*Math.exp(-event.deltaY*.0025),event.clientX-bounds.left,event.clientY-bounds.top);
  },{passive:false});
  viewport.addEventListener('keydown',event=>{
    if(event.target!==viewport)return;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();camera.x+=event.key==='ArrowLeft'?64:event.key==='ArrowRight'?-64:0;camera.y+=event.key==='ArrowUp'?64:event.key==='ArrowDown'?-64:0;manuallyMoved=true;applyCamera()}
    if(['+','=','-','0','f'].includes(event.key)){event.preventDefault();if(event.key==='0'||event.key==='f')fitGraph();else zoom(camera.scale*(event.key==='-'?1/1.15:1.15))}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!drawer.hidden){event.preventDefault();closeDetails()}
    if(event.key==='Tab'&&!drawer.hidden&&mobile()){
      const controls=[...drawer.querySelectorAll('button:not(:disabled),a[href]')];
      const first=controls[0],last=controls[controls.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
    }
  });
  $('#close-details').addEventListener('click',closeDetails);$('#drawer-backdrop').addEventListener('click',closeDetails);
  $('#previous-node').addEventListener('click',()=>navigateNode(-1));$('#next-node').addEventListener('click',()=>navigateNode(1));
  $('#fit').addEventListener('click',()=>fitGraph());$('#fit-top').addEventListener('click',()=>fitGraph());
  $('#zoom-in').addEventListener('click',()=>zoom(camera.scale*1.18));$('#zoom-out').addEventListener('click',()=>zoom(camera.scale/1.18));$('#zoom-value').addEventListener('click',()=>zoom(1));
  $('#retry').addEventListener('click',load);
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(graph.bounds&&!manuallyMoved)fitGraph(true);if(!drawer.hidden){drawer.setAttribute('aria-modal',String(mobile()));$('#drawer-backdrop').hidden=!mobile()}},120)});

  async function load() {
    const version=++loadVersion;$('#loading').hidden=false;$('#error-screen').hidden=true;
    try{
      const data=JSON.parse(document.getElementById('workflow-data').textContent);
      if(version!==loadVersion)return;
      if(!Array.isArray(data.nodes)||!data.nodes.length||data.nodes.length>100||!Array.isArray(data.edges))throw Error('工作流数据暂不完整。');
      const ids=new Set(data.nodes.map(node=>node.id));if(ids.size!==data.nodes.length||data.edges.some(edge=>!ids.has(edge.source)||!ids.has(edge.target)))throw Error('工作流连线暂不完整。');
      documentData=data;graph.nodes=[...data.nodes].sort((a,b)=>(a.order??0)-(b.order??0));graph.edges=data.edges;graph.byId=new Map(graph.nodes.map(node=>[node.id,node]));
      $('#flow-count').textContent=`${graph.nodes.length} 节点 · ${graph.edges.length} 连线`;
      renderGraph();$('#loading').hidden=true;
    }catch(error){if(version!==loadVersion)return;$('#loading').hidden=true;$('#error-screen').hidden=false;$('#error-message').textContent=error.message||'请刷新页面后再试。';$('#flow-count').textContent='暂未加载'}
  }
  load();
})();

  </script>
</body>
</html>
